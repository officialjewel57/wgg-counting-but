<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: verdana;
        background-color: powderblue;
      }
      
      .water-button {
        background-color: #0567FA;
        color: white;
        font-size: 15px;
        padding: 12px;
        border: 2px solid powderblue;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .water-button:hover {
        background-color: #013C94;
        border: 2px solid #0567FA;
      }

      .fire-button {
        background-color: #FFA500;
        color: white;
        font-size: 15px;
        padding: 12px;
        border: 2px solid red;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .fire-button:hover {
        background-color: #FFA500;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <a href="https://hexo.did.science/">
      <img src="https://www.ikea.com/us/en/images/products/fejka-artificial-potted-plant-indoor-outdoor-monstera__0959226_pe809439_s5.jpg?f=s" width=55%>
    </a>
    <a href="https://hexo.did.science/">
      <img src="https://cdn.discordapp.com/attachments/1536029183761842296/1536234548268892190/250px-Stairs_with_weed.png?ex=6a7aa96a&is=6a7957ea&hm=938b4b19c4ad445ecc2c17dde303b952a95c36cb21fcfab8c2942e3b2f91c8b8&">
    </a>
    <button id="destroy-water" class="fire-button">click to remove water</button>
    <h1>You've watered the plant <span id="water-display">0</span> times.</h1>
    <button id="water-the-plant-button" class="water-button">click to water the plant</button>
    <script>
      let waterAmount = 0;
      const button = document.getElementById('water-the-plant-button');
      const display = document.getElementById('water-display');
      button.addEventListener('click', function(){
        waterAmount++;
        display.textContent = waterAmount;
      });
      const button2 = document.getElementById('destroy-water);
      button2.addEventListener('click', function(){
        waterAmount-=1;
        display.textContent = waterAmount;
      });
    </script>
  </body>
</html>
