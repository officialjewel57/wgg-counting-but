<!DOCTYPE html>
<html>
  <head>
    <title>KEEP THE PLANT ALIVE</title>
    <style>
      body {
        font-family: verdana;
        background-color: magenta;
      }
      
      .water-button {
        background-color: #0567FA;
        color: white;
        font-size: 15px;
        padding: 12px;
        border: 2px solid powderblue;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .water-button:hover {
        background-color: #013C94;
        border: 2px solid #0567FA;
      }

      .fire-button {
        background-color: #FFA500;
        color: white;
        font-size: 15px;
        padding: 12px;
        border: 2px solid red;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .fire-button:hover {
        background-color: #FFA500;
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <h1>KEEP THE PLANT ALIVE</h1>
    <a href="https://hexo.did.science/">
      <img id="plant" src="https://www.ikea.com/us/en/images/products/fejka-artificial-potted-plant-indoor-outdoor-monstera__0959226_pe809439_s5.jpg?f=s" width=55%>
    </a>

    <img src="https://images.nationalgeographic.org/image/upload/t_edhub_resource_key_image/v1638882786/EducationHub/photos/sun-blasts-a-m66-flare.jpg" width=450000000000% alt=center text-align: center>
    
    <h1 id = "texttexttext">You've watered the plant <span id="water-display">0</span> times.</h1>
    <h3>You currently lose 1 water per second because of the sun.</h3>
    <button id="water-the-plant-button" class="water-button">click to water the plant :)</button>
    <button id="increase-sun-intensity-button" class="fire-button">click to increase uv rays :(</button>
    <script>
      let waterAmount = 15;
      let sunIntensity = 1;
      let running = true;
      const plant = document.getElementById('plant');
      const waterButton = document.getElementById('water-the-plant-button');
      const sunButton = document.getElementById('increase-sun-intensity-button');
      const display = document.getElementById('water-display');
      const interval = setInterval(wps, 16.66666)
      const interval2 = setInterval(gameOver, 16)
      display.textContent = waterAmount;
      function wps(){
        waterAmount = waterAmount - (sunIntensity / 60);
        display.textContent = waterAmount;
      }
      function gameOver(){
        if(waterAmount < 1){
          plant.src="https://landscape-solutions.net/wp-content/uploads/how-to-tell-if-a-plant-is-dead.jpg";
          alert("you lost :(")
        }
      }
      
      waterButton.addEventListener('click', function(){
        if(running == true){
          waterAmount++;
          display.textContent = waterAmount;
        }
      });

      sunButton.addEventListener('click', function(){
        if(running == true){
          sunIntensity++;
          display.textContent = waterAmount;
        }
      );
    </script>
  </body>
</html>
